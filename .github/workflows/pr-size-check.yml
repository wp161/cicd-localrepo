name: PR Size Check

on:
  pull_request:
    types:
      - opened # Trigger on any new pull request
      - synchronize # Trigger when new commits are pushed to the PR

jobs:
  pr-size-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Fetch PR details
        run: |
          PR_LINES=$(gh pr diff ${{ github.event.pull_request.number }} --stat | awk '/files changed/ {print $1}')
          echo "PR_LINES=$PR_LINES" >> $GITHUB_ENV

      - name: Check for override label
        run: |
          gh pr view ${{ github.event.pull_request.number }} --json labels --jq '.labels[].name' | grep 'override-size-limit' && echo "OVERRIDE=true" >> $GITHUB_ENV || echo "OVERRIDE=false" >> $GITHUB_ENV

      - name: Fail if PR exceeds 150 lines and no override
        run: |
          if [[ $PR_LINES -gt 150 && $OVERRIDE == "false" ]]; then
            echo "PR exceeds 150 lines. Please submit a smaller PR, or add a label "override-size-limit" to the PR to override."
            exit 1
          else
            echo "PR size is within limit or override is enabled."
          fi
