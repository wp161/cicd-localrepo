stages:
  - build
  - test
  - documentation
  - deploy

default:
  name: pipeline
  docker:
    image: openjdk17

compile:
  # needs:
  needs: ["validation"]
  stage: build
  script:
    - echo "Compile application"
    # - gradle classes
  artifacts:  
    when: on_success
    access: all
    expire_in: "30 days"
    paths:
      - app/build/classes/*



validation:
  needs: ["validation2", "validation3"]
  stage: build
  script:
    - echo "Running validations"
    # - gradle checkstyleMain checkstyleTest spotbugsMain
  artifacts:
    when: on_success
    access: all
    expire_in: "30 days"
    paths:
      - app/build/reports/*

validation2:
  needs: []
  stage: build
  script:
    - echo "Running validations"
    # - gradle checkstyleMain checkstyleTest spotbugsMain
  artifacts:
    when: on_success
    access: all
    expire_in: "30 days"
    paths:
      - app/build/reports/*

validation3:
  needs: ["validation2"]
  stage: build
  script:
    - echo "Running validations"
    # - gradle checkstyleMain checkstyleTest spotbugsMain
  artifacts:
    when: on_success
    access: all
    expire_in: "30 days"
    paths:
      - app/build/reports/*

testing:
  stage: test
  script:
    - echo "Running unit tests... "
    # - gradle test jacocoTestReport
  artifacts:
    when: on_success
    access: all
    expire_in: "30 days"
    paths:
      - app/build/reports/*

javadoc:
  stage: documentation
  script:
    - echo "Generate Javadocs"
    # - gradle javadoc
  artifacts:

    when: on_success
    access: all
    expire_in: "30 days"
    paths:
      - app/build/docs/*

distribution: 
  stage: deploy
  script:
    - echo "Create distribution"
    # - gradle assembleDist
  artifacts:
    when: on_success
    access: all
    expire_in: "30 days"
    paths:
      - app/build/distributions/*
      - app/build/docs/*
      - app/build/reports/*